[workspace]
authors = ["Richard <502763+RichardQZeng@users.noreply.github.com>"]
channels = ["nodefaults", "bera_tools", "conda-forge"]
description = "BERA Tools is toolset to extract and assess line features in forest"
name = "bera"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
main_tk = "python main.py"
main = "python ./beratools/gui/main.py"

[dependencies]
python = "3.12.*"
dask = "*"
gdal = ">=3.12,<4"
geopandas = "*"
pandas = ">2.0"
networkit = "*"
numpy = ">=1.26,<2.4"
pyarrow = "*"
pyogrio = ">=0.9.0"
pygments = ">=2.20"
pyqt = "*"
rasterio = "*"
scikit-image = ">=0.24.0"
tabulate = "*"
tqdm = "*"
xarray-spatial = "*"
pytest = "*"
pytest-qt = "*"
pytest-cov = "*"
coverage = "*"
python-igraph = "*"
psutil = "*"
hydra-core = "*"

# R for the PC2Products LiDAR tools: they install the R packages they need (lidR, terra, sf, ...)
# into this R on first use. Held at 4.5.x because conda-forge's linux-64 rpy2 is only built for R 4.5.
r-base = ">=4.5,<4.6"

[target.linux-64.dependencies]
rpy2 = "*"
# CRAN only ships source packages for Linux, and the GDAL/GEOS/PROJ-linked ones (terra, sf, ...)
# fail to compile against the pixi R, so take the prebuilt conda-forge builds on linux-64.
# win-64 keeps installing CRAN binaries at runtime (conda-forge has no R 4.5 win-64 builds).
r-lidr = "*"
r-rlas = "*"
r-rcsf = "*"
r-future = "*"
r-terra = "*"
r-sp = "*"
r-raster = "*"
r-stars = "*"
r-sf = "*"
r-gstat = "*"

# conda-forge has no win-64 rpy2 build for R 4.5, so install it from PyPI
[target.win-64.pypi-dependencies]
rpy2 = "*"

[pypi-dependencies]
hatch-vcs = "*"
beratools = { path = ".", editable = true }
zensical = "==0.0.53"
mkdocstrings = "*"
mkdocstrings-python = "*"
pymdown-extensions = "*"
