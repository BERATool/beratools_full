# run: conda env create -n bera -f environment.yml -q

# name: bera
channels:
  - nodefaults
  - conda-forge
  - bera_tools
dependencies:
  - python>=3.12,<3.14
  - dask
  - gdal>=3.12,<4
  - geopandas
  - pandas
  - networkit
  - numpy>=1.26,<2.4
  - pandas
  - pyogrio>=0.12
  - pyqt
  - rasterio>=1.5
  - scikit-image>=0.24.0
  - tqdm
  - xarray-spatial
  - tabulate
  - python-igraph
  - psutil
  - hydra-core
  - pip
  # R for the PC2Products LiDAR tools: they install the R packages they need (lidR, terra, sf, ...) on first use
  - r-base>=4.5,<4.6
  - pip:
      # conda-forge has no win-64 rpy2 build for R 4.5, so install it from PyPI
      - rpy2
variables:
  {}
