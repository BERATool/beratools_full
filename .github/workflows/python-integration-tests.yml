name: Python Tests / Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'beratools/**'
      - 'tests/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pyproject.toml'
      - '.github/workflows/python-integration-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'beratools/**'
      - 'tests/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pyproject.toml'
      - '.github/workflows/python-integration-tests.yml'

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Pixi integration
    # R packages for the PC2Products tools come prebuilt from conda-forge on linux-64 (see pixi.toml)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Pixi environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: false

      - name: Run integration tests
        run: pixi run pytest --cov=beratools --cov-report=term tests/test_workflow.py --maxfail=1 --disable-warnings -s -v --log-cli-level=INFO

      - name: Install Ubuntu dependencies for R
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Run R environment test (installs missing R packages into the pixi R)
        run: pixi run pytest tests/test_r_environment.py --maxfail=1 --disable-warnings -v --log-cli-level=INFO

      - name: Run PC2Products workflow test
        run: pixi run pytest --cov=beratools --cov-report=term tests/test_r_workflow.py --maxfail=1 --disable-warnings -v --log-cli-level=INFO
